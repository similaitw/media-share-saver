name: Mobile verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'docs/TASKS.md'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS resolver base URL for physical-device debug APK'
        required: false
        default: ''
        type: string

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          script: flutter test integration_test/app_test.dart
          working-directory: apps/mobile

  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            case "$API_BASE_URL" in
              https://*) ;;
              *) echo "api_base_url must use HTTPS" >&2; exit 1 ;;
            esac
            echo "Building physical-device APK with supplied HTTPS resolver endpoint"
            flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            echo "Building default emulator-safe APK"
            flutter build apk --debug
          fi
      - name: Show APK diagnostics
        run: |
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-share-saver-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
